[package]
name = "tcpscreen-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# ESP32-S3 HAL and runtime — esp-hub75 re-exports esp-hal, esp-rtos, etc.
esp-hub75 = { version = "0.9.0", features = ["esp32s3", "iram", "log"] }
hub75-framebuffer = { version = "0.6.0", features = ["esp-hal-dma"] }

# WiFi via esp-radio (new API replacing esp-wifi)
esp-radio = { version = "0.17.0", features = ["esp32s3", "wifi", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp-radio", "embassy", "esp32s3"] }

# Core esp-hal (version must match esp-hub75's dep)
esp-hal = { version = "1.0.0", features = ["esp32s3", "log-04", "unstable", "psram"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-alloc = "0.9.0"
esp-bootloader-esp-idf = { version = "0.3", features = ["esp32s3"] }

# Embassy async runtime + networking
embassy-executor = "0.9.0"
embassy-net = { version = "0.8.0", features = ["tcp", "dhcpv4", "medium-ethernet"] }
embassy-sync = "0.7.0"
embassy-time = "0.5.0"

# Drawing and utilities
embedded-graphics = "0.8.1"
embedded-io-async = "0.7.0"
embassy-futures = "0.1"
heapless = "0.8"
static_cell = "2"
log = "0.4"

[profile.release]
opt-level = "s"
lto = "fat"
